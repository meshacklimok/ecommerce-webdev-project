{% extends "base.html" %}
{% load static %}

{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-6">

        <div class="card shadow-lg border-0 text-center" style="border-radius: 15px;">
            <div class="card-header bg-success text-white py-3" style="border-radius: 15px 15px 0 0;">
                <h3 class="mb-0">Password Reset Complete</h3>
            </div>

            <div class="card-body">

                <p class="text-muted">
                    Your password has been successfully reset.  
                    You may now log in with your new password.
                </p>

                <a href="{% url 'login' %}" class="btn btn-success fw-bold w-100 mt-3">
                    Login Now
                </a>

            </div>
        </div>

    </div>
</div>
{% endblock %}
